<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentic RAG System - Gemini File Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .upload-section {
            grid-column: 1 / -1;
        }

        .file-input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            display: inline-block;
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .file-input-label:hover {
            background: #5568d3;
        }

        .file-list {
            margin-top: 10px;
            padding: 10px;
            background: #f5f5f5;
            border-radius: 5px;
            min-height: 50px;
        }

        .file-item {
            padding: 5px;
            margin: 5px 0;
            background: white;
            border-radius: 3px;
            font-size: 0.9em;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 1em;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .config-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .query-section {
            grid-column: 1 / -1;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            margin-bottom: 15px;
            font-size: 1em;
            font-family: inherit;
            resize: vertical;
            min-height: 100px;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .response-area {
            margin-top: 20px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 5px;
            min-height: 150px;
            display: none;
        }

        .response-area.active {
            display: block;
        }

        .response-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .query-type-badge {
            padding: 5px 12px;
            background: #667eea;
            color: white;
            border-radius: 15px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .response-text {
            line-height: 1.8;
            color: #333;
            margin-bottom: 20px;
        }

        .citations {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .citations h4 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .citation-item {
            padding: 10px;
            margin: 8px 0;
            background: white;
            border-left: 4px solid #667eea;
            border-radius: 3px;
            font-size: 0.9em;
        }

        .citation-source {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .citation-snippet {
            color: #666;
            font-style: italic;
        }

        .status-message {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .status-message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-message.active {
            display: block;
        }

        .stats-bar {
            background: white;
            border-radius: 10px;
            padding: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 10px;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-left: 10px;
            vertical-align: middle;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .conversation-history {
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 15px;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .message.user {
            background: #e3f2fd;
            margin-left: 20px;
        }

        .message.assistant {
            background: #f5f5f5;
            margin-right: 20px;
        }

        .message-role {
            font-weight: bold;
            margin-bottom: 5px;
            color: #667eea;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .actions button {
            flex: 1;
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Agentic RAG System</h1>
            <p>Powered by Google Gemini File Search API</p>
        </div>

        <div class="stats-bar" id="statsBar">
            <div class="stat-item">
                <div class="stat-value" id="statStores">0</div>
                <div class="stat-label">Knowledge Bases</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statDocs">0</div>
                <div class="stat-label">Documents</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="statMessages">0</div>
                <div class="stat-label">Messages</div>
            </div>
        </div>

        <div class="main-content">
            <div class="card upload-section">
                <h2>Create Knowledge Base</h2>
                <div class="status-message" id="uploadStatus"></div>

                <input type="text" id="storeName" placeholder="Knowledge Base Name (optional)">

                <div class="config-group">
                    <div>
                        <label for="maxTokens">Max Tokens per Chunk:</label>
                        <input type="number" id="maxTokens" value="500" min="100" max="2000">
                    </div>
                    <div>
                        <label for="overlapTokens">Overlap Tokens:</label>
                        <input type="number" id="overlapTokens" value="50" min="0" max="500">
                    </div>
                </div>

                <div class="file-input-wrapper">
                    <label for="fileInput" class="file-input-label">
                        Choose Files to Upload
                    </label>
                    <input type="file" id="fileInput" multiple accept=".txt,.pdf,.doc,.docx,.xlsx,.pptx,.csv,.json,.md,.py,.js,.java,.cpp,.html,.xml,.ipynb">
                </div>

                <div class="file-list" id="fileList">
                    <em>No files selected</em>
                </div>

                <button id="uploadBtn" onclick="uploadFiles()" disabled>
                    Create Knowledge Base
                </button>
            </div>

            <div class="card query-section">
                <h2>Ask Questions</h2>
                <div class="status-message" id="queryStatus"></div>

                <textarea id="questionInput" placeholder="Ask a question about your documents..."></textarea>

                <div class="actions">
                    <button id="queryBtn" onclick="askQuestion()">
                        Ask Question
                    </button>
                    <button class="btn-secondary" onclick="clearConversation()">
                        Clear History
                    </button>
                </div>

                <div class="response-area" id="responseArea">
                    <div class="response-header">
                        <h3>Response</h3>
                        <span class="query-type-badge" id="queryTypeBadge">GENERAL</span>
                    </div>
                    <div class="response-text" id="responseText"></div>
                    <div class="citations" id="citationsArea" style="display: none;">
                        <h4>Citations</h4>
                        <div id="citationsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let selectedFiles = [];

        // File input handling
        document.getElementById('fileInput').addEventListener('change', function(e) {
            selectedFiles = Array.from(e.target.files);
            updateFileList();
        });

        function updateFileList() {
            const fileList = document.getElementById('fileList');
            const uploadBtn = document.getElementById('uploadBtn');

            if (selectedFiles.length === 0) {
                fileList.innerHTML = '<em>No files selected</em>';
                uploadBtn.disabled = true;
            } else {
                fileList.innerHTML = selectedFiles.map(file =>
                    `<div class="file-item">${file.name} (${formatFileSize(file.size)})</div>`
                ).join('');
                uploadBtn.disabled = false;
            }
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        async function uploadFiles() {
            const uploadBtn = document.getElementById('uploadBtn');
            const statusEl = document.getElementById('uploadStatus');

            if (selectedFiles.length === 0) {
                showStatus('uploadStatus', 'Please select files to upload', 'error');
                return;
            }

            uploadBtn.disabled = true;
            uploadBtn.innerHTML = 'Uploading and Indexing... <span class="loading"></span>';

            const formData = new FormData();
            selectedFiles.forEach(file => {
                formData.append('files[]', file);
            });

            const storeName = document.getElementById('storeName').value;
            if (storeName) {
                formData.append('store_name', storeName);
            }

            formData.append('max_tokens', document.getElementById('maxTokens').value);
            formData.append('overlap_tokens', document.getElementById('overlapTokens').value);

            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    showStatus('uploadStatus', data.message, 'success');
                    selectedFiles = [];
                    updateFileList();
                    document.getElementById('fileInput').value = '';
                    updateStats();
                } else {
                    showStatus('uploadStatus', data.error || 'Upload failed', 'error');
                }
            } catch (error) {
                showStatus('uploadStatus', 'Error: ' + error.message, 'error');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.innerHTML = 'Create Knowledge Base';
            }
        }

        async function askQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            const queryBtn = document.getElementById('queryBtn');

            if (!question) {
                showStatus('queryStatus', 'Please enter a question', 'error');
                return;
            }

            queryBtn.disabled = true;
            queryBtn.innerHTML = 'Searching... <span class="loading"></span>';

            try {
                const response = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ question })
                });

                const data = await response.json();

                if (data.success) {
                    displayResponse(data);
                    document.getElementById('questionInput').value = '';
                    updateStats();
                } else {
                    showStatus('queryStatus', data.error || 'Query failed', 'error');
                }
            } catch (error) {
                showStatus('queryStatus', 'Error: ' + error.message, 'error');
            } finally {
                queryBtn.disabled = false;
                queryBtn.innerHTML = 'Ask Question';
            }
        }

        function displayResponse(data) {
            const responseArea = document.getElementById('responseArea');
            const responseText = document.getElementById('responseText');
            const queryTypeBadge = document.getElementById('queryTypeBadge');
            const citationsArea = document.getElementById('citationsArea');
            const citationsList = document.getElementById('citationsList');

            responseArea.classList.add('active');
            responseText.textContent = data.answer;
            queryTypeBadge.textContent = data.query_type;

            if (data.citations && data.citations.length > 0) {
                citationsArea.style.display = 'block';
                citationsList.innerHTML = data.citations.map(citation => `
                    <div class="citation-item">
                        <div class="citation-source">[${citation.index}] ${citation.source}</div>
                        <div class="citation-snippet">${citation.snippet}</div>
                    </div>
                `).join('');
            } else {
                citationsArea.style.display = 'none';
            }
        }

        async function clearConversation() {
            try {
                const response = await fetch('/clear-conversation', {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    showStatus('queryStatus', 'Conversation history cleared', 'success');
                    document.getElementById('responseArea').classList.remove('active');
                    updateStats();
                }
            } catch (error) {
                showStatus('queryStatus', 'Error: ' + error.message, 'error');
            }
        }

        async function updateStats() {
            try {
                const response = await fetch('/stats');
                const data = await response.json();

                document.getElementById('statStores').textContent = data.total_stores || 0;
                document.getElementById('statDocs').textContent = data.total_documents || 0;
                document.getElementById('statMessages').textContent = data.conversation_length || 0;
            } catch (error) {
                console.error('Error updating stats:', error);
            }
        }

        function showStatus(elementId, message, type) {
            const statusEl = document.getElementById(elementId);
            statusEl.textContent = message;
            statusEl.className = `status-message ${type} active`;

            setTimeout(() => {
                statusEl.classList.remove('active');
            }, 5000);
        }

        // Enable Enter key to submit question
        document.getElementById('questionInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                askQuestion();
            }
        });

        // Load stats on page load
        updateStats();
    </script>
</body>
</html>
